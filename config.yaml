# lytrade 标的池与策略配置
# ⚠️ 模拟交易专用配置，不构成任何投资建议

account:
  initial_cash: 100000          # 虚拟初始资金 (HKD/USD 混合计价按 1:1 简化 v1)
  fee_rate: 0.0003              # 佣金 万3
  slippage: 0.001               # 滑点 0.1%
  max_position_pct: 0.3         # 单标的最大仓位 30%

strategy:
  name: ma_cross_plus_news      # 双均线 + 资讯热度过滤（事件驱动）
  fast: 5                       # MA5
  slow: 20                      # MA20
  event_lambda: 0.1             # 事件信号衰减 λ（方法论: e^(-λN)）
  event_heat_min: 0.15          # 资讯热度低于此值时只平不开（0.3 过严：科技 RSS 源对港股覆盖稀疏）
  kline_count: 120              # 回测/信号用日线根数

lysource:
  base_url: https://lain42.top/lysource
  # token 从环境变量 LYSOURCE_TOKEN 读取，避免落盘

symbols:                        # CLI 用的 LongBridge 代码
  - symbol: 00700.HK
    name: 腾讯控股
  - symbol: 09988.HK
    name: 阿里巴巴-W
  - symbol: AAPL.US
    name: 苹果
  - symbol: NVDA.US
    name: 英伟达
