# lytrade 标的池与策略配置
# ⚠️ 模拟交易专用配置，不构成任何投资建议

account:
  initial_cash: 100000          # 虚拟初始资金 (HKD/USD 混合计价按 1:1 简化 v1)
  fee_rate: 0.0003              # 佣金 万3
  slippage: 0.001               # 滑点 0.1%
  max_position_pct: 0.3         # 单标的最大仓位 30%

strategy:
  name: ma_cross_plus_news      # 双均线 + 资讯热度过滤（事件驱动）
  kline_period: 5m              # ⚡ 分钟级引擎: 日内信号活跃, 面板可见买卖滚动（回测 CLI 仍默认 day）
  fast: 12                      # MA12 根 5m ≈ 1 小时
  slow: 48                      # MA48 根 5m ≈ 4 小时
  event_lambda: 0.1             # 事件信号衰减 λ（方法论: e^(-λN)）
  event_heat_min: 0.15          # 资讯热度低于此值时只平不开
  kline_count: 150              # 150 根 5 分钟线 ≈ 12.5 小时窗口
  bb_period: 20                 # 布林带周期（根数）
  bb_multiplier: 2.0            # 上下轨 ±2σ

lysource:
  base_url: https://lain42.top/lysource
  # token 从环境变量 LYSOURCE_TOKEN 读取，避免落盘

arb:                              # 跨市场 ADR 套利（市场中性，不吃资讯热度过滤）
  enabled: true
  pair: ["09988.HK", "BABA.US"]   # 同一公司: 港股 × 美股 ADS
  ads_ratio: 8                    # 1 ADS = 8 ordinary shares
  fx_usdhkd: 7.8                  # 联系汇率近似（7.75-7.85，误差<0.5%）
  lookback: 60                    # 溢价率滚动窗口（交易日）
  entry_z: 2.0                    # |Z|>2 开仓价差
  exit_z: 0.5                     # |Z|<0.5 回归平仓
  notional_pct: 0.3               # 名义头寸占初始资金 30%

symbols:                        # CLI 用的 LongBridge 代码
  - symbol: 00700.HK
    name: 腾讯控股
  - symbol: 09988.HK
    name: 阿里巴巴-W
  - symbol: AAPL.US
    name: 苹果
  - symbol: NVDA.US
    name: 英伟达
